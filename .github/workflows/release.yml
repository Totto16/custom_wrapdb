name: Prepare release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  # We do NOT want `cancel-in-progress` here since only one website job
  # should run at a time to avoid upload race conditions.

jobs:
  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Upload release assets
        run: |
          ./tools/create_release.py --repo ${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
      - name: Upload static website
        uses: actions/upload-pages-artifact@v5

  update_index:
    needs: create_release
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}Wrapdb-projects.html
    steps:
      - name: Deploy static website
        id: deploy
        uses: actions/deploy-pages@v5
